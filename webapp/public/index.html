<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<title>Accretion</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css?v=12" />
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <button id="sidebar-toggle" type="button" title="Hide Project (Alt+1)" aria-label="Hide Project">‹</button>
      <div id="sidebar-body">
      <div id="sidebar-header">
        <div class="sidebar-brand">
          <span class="sidebar-kicker">Workspace</span>
          <span class="sidebar-title">Accretion</span>
        </div>
        <div class="sidebar-actions">
          <button id="new-file-btn" title="New file, mindmap, flow, or folder">＋</button>
          <button id="import-btn" title="Import files or a zip">↑</button>
          <button id="export-all-btn" title="Export workspace as zip">⤓</button>
          <button id="refresh-btn" title="Refresh tree">↻</button>
        </div>
      </div>
      <div id="search-box">
        <input id="search-input" type="text" placeholder="Search files and content" />
        <div id="search-filters">
          <button type="button" class="search-filter active" data-search-type="">All</button>
          <button type="button" class="search-filter" data-search-type="mindmap">Mindmaps</button>
          <button type="button" class="search-filter" data-search-type="flow">Flows</button>
          <button type="button" class="search-filter" data-search-type="json">JSON</button>
          <button type="button" class="search-filter" data-search-type="yaml">YAML</button>
          <button type="button" class="search-filter" data-search-type="pdf">PDFs</button>
        </div>
        <div id="search-results" class="hidden"></div>
      </div>
      <div id="favorites-section">
        <div id="favorites-header">
          <span>Bookmarks</span>
          <button type="button" id="bookmark-add-cat" title="New bookmark category">＋</button>
        </div>
        <div id="favorites-list"></div>
      </div>
      <div id="tree-section">
        <div id="tree-header">Files</div>
        <div id="tree"></div>
      </div>
      </div>
    </div>
    <div id="main">
      <div id="toolbar">
        <div class="toolbar-group toolbar-info">
          <div>
            <span class="path-kicker">Open file</span>
            <span id="current-path">No file open</span>
          </div>
          <span id="status" class="status"></span>
        </div>
        <div class="spacer"></div>

        <div class="toolbar-group">
          <button id="find-in-file-btn" disabled title="Search within the open file (Cmd/Ctrl+F)">Find</button>
          <button id="collapse-all-btn" disabled title="Collapse all foldable sections">Collapse</button>
          <button id="expand-all-btn" disabled title="Expand all foldable sections">Expand</button>
        </div>

        <div class="toolbar-sep"></div>

        <div class="toolbar-group">
          <button id="back-to-latest-btn" class="hidden">&larr; Latest</button>
          <button id="history-btn" disabled>History</button>
          <button id="commit-btn" disabled title="Save a named version to history">Commit</button>
        </div>

        <div class="toolbar-sep"></div>

        <div class="toolbar-group">
          <button id="convert-btn" disabled>Convert</button>
          <button id="view-toggle-btn" class="hidden">View source</button>
        </div>

        <div class="toolbar-sep"></div>

        <div class="toolbar-group">
          <label id="autosave-toggle" class="toggle">
            <input type="checkbox" id="autosave-checkbox" checked />
            <span>Auto-save</span>
          </label>
          <button id="export-file-btn" disabled title="Download this file to share">Export</button>
          <button id="standalone-btn" class="hidden" title="Download a self-contained HTML that opens in any browser">Standalone</button>
          <button id="saveas-btn" disabled>Save as</button>
          <button id="save-btn" disabled>Save</button>
          <button id="fullscreen-btn" disabled title="Fullscreen this file (Esc to exit)">Fullscreen</button>
          <button id="theme-btn" title="Toggle light/dark mode">Dark mode</button>
        </div>
      </div>
      <div id="editor-area">
        <div id="editor"></div>
        <iframe id="html-preview-frame" class="hidden" sandbox="allow-scripts allow-forms allow-modals" referrerpolicy="no-referrer"></iframe>
        <iframe id="pdf-frame" class="hidden" title="PDF viewer"></iframe>
        <div id="mindmap-stage" class="hidden"></div>
      </div>
    </div>
  </div>

  <div id="history-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span id="history-title">Version history</span>
        <button id="history-close">&times;</button>
      </div>
      <div id="history-list"></div>
    </div>
  </div>

  <div id="ask-modal" class="modal hidden">
    <div class="modal-content ask-modal-content">
      <div class="modal-header">
        <span id="ask-title">Create new</span>
        <button type="button" id="ask-close">&times;</button>
      </div>
      <div class="ask-body">
        <div id="ask-kinds" class="ask-kinds hidden"></div>
        <label id="ask-label" for="ask-input">Name</label>
        <input id="ask-input" type="text" autocomplete="off" spellcheck="false" />
        <div id="ask-hint" class="ask-hint"></div>
      </div>
      <div class="ask-actions">
        <button type="button" id="ask-cancel">Cancel</button>
        <button type="button" id="ask-ok" class="ask-primary">Create</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs/loader.js"></script>
  <input id="import-file" class="file-hidden" type="file" multiple />
  <script src="app.js?v=130"></script>
</body>
</html>
