<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="space" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset=".55" stop-color="#0b0a1f"/>
      <stop offset="1" stop-color="#05050d"/>
    </radialGradient>
    <!-- disk: white-hot inner edge to deep orange outer edge -->
    <radialGradient id="disk" cx="50%" cy="50%" r="50%">
      <stop offset=".34" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".38" stop-color="#fff7e0"/>
      <stop offset=".5" stop-color="#ffd27a"/>
      <stop offset=".68" stop-color="#ff8a2a"/>
      <stop offset=".86" stop-color="#c2410c" stop-opacity=".75"/>
      <stop offset="1" stop-color="#7c2d12" stop-opacity="0"/>
    </radialGradient>
    <!-- lensed far side of the disk arcing over the hole -->
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0"/>
      <stop offset=".2" stop-color="#ffb347"/>
      <stop offset=".5" stop-color="#fff4d6"/>
      <stop offset=".8" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset=".25" stop-color="#ffb347" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#space)"/>
    <!-- stars -->
    <g fill="#fff">
      <circle cx="78" cy="92" r="2.2" opacity=".8"/><circle cx="430" cy="70" r="1.8" opacity=".7"/>
      <circle cx="452" cy="402" r="2.4" opacity=".6"/><circle cx="64" cy="420" r="1.6" opacity=".6"/>
      <circle cx="140" cy="54" r="1.2" opacity=".5"/><circle cx="390" cy="460" r="1.3" opacity=".5"/>
      <circle cx="470" cy="210" r="1.2" opacity=".5"/><circle cx="36" cy="250" r="1.4" opacity=".55"/>
    </g>
    <!-- outer glow -->
    <ellipse cx="256" cy="262" rx="230" ry="150" fill="url(#glow)" filter="url(#softer)"/>
    <!-- far half of the disk (behind the hole) -->
    <g transform="translate(256 262) rotate(-14) scale(1 .3)">
      <circle r="225" fill="url(#disk)" filter="url(#soft)"/>
    </g>
    <!-- lensed arc over the top -->
    <g transform="rotate(-14 256 262)">
      <path d="M150 262 A106 106 0 0 1 362 262" fill="none" stroke="url(#arc)" stroke-width="20" stroke-linecap="round" filter="url(#soft)" opacity=".95"/>
      <path d="M156 262 A100 100 0 0 1 356 262" fill="none" stroke="#fffaf0" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    </g>
    <!-- event horizon with photon ring -->
    <circle cx="256" cy="262" r="84" fill="#000"/>
    <circle cx="256" cy="262" r="87" fill="none" stroke="#ffe3a3" stroke-width="3.5" opacity=".9"/>
    <!-- near half of the disk, in front of the hole -->
    <g transform="translate(256 262) rotate(-14) scale(1 .3)">
      <clipPath id="front"><rect x="-260" y="0" width="520" height="260"/></clipPath>
      <circle r="225" fill="url(#disk)" clip-path="url(#front)"/>
      <circle r="225" fill="url(#disk)" clip-path="url(#front)" filter="url(#soft)" opacity=".7"/>
    </g>
  </g>
</svg>
